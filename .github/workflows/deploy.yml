# DESATIVADO. O site foi migrado para o Azure Static Web Apps; quem publica
# agora e o workflow azure-static-web-apps-*.yml.
#
# Este arquivo foi mantido, e nao apagado, para preservar o historico e permitir
# voltar ao GitHub Pages em emergencia. Para reativar, descomente o bloco `push`
# abaixo. ATENCAO: as URLs limpas (/servicos) NAO funcionam no GitHub Pages, que
# nao sabe devolver o index.html para um caminho qualquer. Reativar sem reverter
# o roteamento publica um site que quebra ao recarregar qualquer pagina interna.
name: Deploy GitHub Pages

on:
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Se dois pushes acontecerem juntos, vale o ultimo.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint:css

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
